<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前后端连接测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 10px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .loading {
            background: #fff3cd;
            color: #856404;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #5568d3;
        }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            max-height: 300px;
        }
        .info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 LeetCode Learning Platform - 连接测试</h1>
        
        <div class="info">
            <strong>📝 说明：</strong> 此页面用于测试前端与后端的连接状态
        </div>

        <div class="test-section">
            <h3>1. 后端健康检查 <span id="backend-status" class="status loading">测试中...</span></h3>
            <p><strong>测试地址：</strong> http://localhost:8000/health</p>
            <button onclick="testBackend()">重新测试</button>
            <pre id="backend-result">等待测试...</pre>
        </div>

        <div class="test-section">
            <h3>2. API 数据获取 <span id="api-status" class="status loading">测试中...</span></h3>
            <p><strong>测试地址：</strong> http://localhost:8000/api/knowledge/points</p>
            <button onclick="testAPI()">重新测试</button>
            <pre id="api-result">等待测试...</pre>
        </div>

        <div class="test-section">
            <h3>3. CORS 跨域测试 <span id="cors-status" class="status loading">测试中...</span></h3>
            <p><strong>说明：</strong> 测试前端是否能跨域访问后端</p>
            <button onclick="testCORS()">重新测试</button>
            <pre id="cors-result">等待测试...</pre>
        </div>

        <div class="test-section">
            <h3>📋 快速访问</h3>
            <button onclick="window.open('http://localhost:8000/docs', '_blank')">
                📚 查看 API 文档
            </button>
            <button onclick="window.open('http://localhost:5173', '_blank')">
                🎨 打开前端应用
            </button>
        </div>
    </div>

    <script>
        // 测试后端健康检查
        async function testBackend() {
            const statusEl = document.getElementById('backend-status');
            const resultEl = document.getElementById('backend-result');
            
            statusEl.className = 'status loading';
            statusEl.textContent = '测试中...';
            resultEl.textContent = '正在连接...';
            
            try {
                const response = await fetch('http://localhost:8000/health');
                const data = await response.json();
                
                statusEl.className = 'status success';
                statusEl.textContent = '✅ 成功';
                resultEl.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ 失败';
                resultEl.textContent = '错误: ' + error.message + '\n\n请确保后端服务已启动：\ncd backend && uvicorn main:app --reload';
            }
        }

        // 测试 API 数据
        async function testAPI() {
            const statusEl = document.getElementById('api-status');
            const resultEl = document.getElementById('api-result');
            
            statusEl.className = 'status loading';
            statusEl.textContent = '测试中...';
            resultEl.textContent = '正在获取数据...';
            
            try {
                const response = await fetch('http://localhost:8000/api/knowledge/points');
                const data = await response.json();
                
                statusEl.className = 'status success';
                statusEl.textContent = `✅ 成功 (${data.length} 条记录)`;
                resultEl.textContent = JSON.stringify(data.slice(0, 3), null, 2) + '\n\n... 共 ' + data.length + ' 条数据';
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ 失败';
                resultEl.textContent = '错误: ' + error.message;
            }
        }

        // 测试 CORS
        async function testCORS() {
            const statusEl = document.getElementById('cors-status');
            const resultEl = document.getElementById('cors-result');
            
            statusEl.className = 'status loading';
            statusEl.textContent = '测试中...';
            resultEl.textContent = '正在测试跨域访问...';
            
            try {
                const response = await fetch('http://localhost:8000/api/knowledge/points', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });
                
                if (response.ok) {
                    statusEl.className = 'status success';
                    statusEl.textContent = '✅ CORS 配置正确';
                    resultEl.textContent = '跨域请求成功！\n\nCORS Headers:\n' + 
                        'Access-Control-Allow-Origin: ' + response.headers.get('access-control-allow-origin') + '\n' +
                        'Access-Control-Allow-Methods: ' + response.headers.get('access-control-allow-methods') + '\n' +
                        'Status: ' + response.status;
                } else {
                    throw new Error('HTTP ' + response.status);
                }
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ CORS 错误';
                resultEl.textContent = '错误: ' + error.message + '\n\n可能原因：\n1. 后端未启动\n2. CORS 配置错误\n3. 端口不匹配';
            }
        }

        // 页面加载时自动测试
        window.onload = function() {
            setTimeout(() => {
                testBackend();
                setTimeout(() => testAPI(), 500);
                setTimeout(() => testCORS(), 1000);
            }, 500);
        };
    </script>
</body>
</html>
