[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options
addopts = 
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    -v
    -s

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning



